<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gestão de Intervalo">
  <rect width="512" height="512" fill="#003865"/>
  <!-- Trilho em perspectiva: dois boletos e os dormentes entre eles. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M181 400 L226 150" stroke-width="22"/>
    <path d="M331 400 L286 150" stroke-width="22"/>
    <g stroke-width="16" opacity="0.9">
      <path d="M168 366 L344 366"/>
      <path d="M182 296 L330 296"/>
      <path d="M196 226 L316 226"/>
      <path d="M210 162 L302 162"/>
    </g>
  </g>
  <!-- O ponteiro: o intervalo e uma janela de tempo, nao so um trecho. -->
  <circle cx="366" cy="146" r="74" fill="#22A884"/>
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round">
    <path d="M366 100 L366 148"/>
    <path d="M366 148 L400 168"/>
  </g>
</svg>
